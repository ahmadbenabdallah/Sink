name: fork-ci

# Validation only: no secrets, no deployment (Cloudflare builds from the connected repo).
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: fork-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint --quiet
      - run: pnpm types:check
      - run: pnpm locales:check

  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Not a secret: a fixed test token. It is baked in at build time, so the
      # build and the tests must see the same value.
      NUXT_SITE_TOKEN: fork-ci-test-token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Worker tests execute .output/server/index.mjs, so build first.
      - run: pnpm build
      - run: pnpm test --run
