packages:
  - docs

strictPeerDependencies: true
overrides:
  source-map-resolve@0.6.0>decode-uri-component: 0.5.1
  vue-metamorph@3.3.4>glob: 11.1.0
  vitepress@1.6.4>vite: ^6.4.4
  # Security patches within the same major until wrangler / eslint plugins bump them.
  tinypool: ^2.1.2
  undici: ^7.29.0
  sharp: ^0.35.5
  katex: ^0.18.2
  brace-expansion@1: ^1.1.21
  minimatch@>=7 <11.0.1: ^11.0.1
  '@esbuild-kit/core-utils>esbuild': ^0.25.0
peerDependencyRules:
  allowedVersions:
    # Optional peers with ranges stricter than needed; build, lint and the full
    # test suite pass with these versions. Drop once upstream widens the ranges.
    '@vitest/eslint-plugin>typescript': '5'
    rolldown: '1.3'
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  maplibre-gl: true
  sharp: true
  simple-git-hooks: true
  unrs-resolver: true
  vue-demi: true
  workerd: true
minimumReleaseAgeExclude:
  - '@nuxtjs/i18n@10.4.1'
  - eslint@10.7.0
  - virtua@0.49.3
